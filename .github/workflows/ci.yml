name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      # Unit tests, with the coverage thresholds set in each workspace's vitest.config.ts.
      # The checks against the real vault run by hand, because the vault is a separate private repository:
      #   VAULT_PATH=<checkout> npm test -w packages/vault
      - run: npm test
      - run: npm run build
